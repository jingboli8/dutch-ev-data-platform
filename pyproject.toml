[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dutch-ev-data-platform"
version = "0.3.0"
description = "A privacy-aware RDW ingestion and dimensional analytics platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "dbt-core>=1.10.15,<1.11",
  "dbt-duckdb>=1.10,<1.11",
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.15,<0.16",
]

[project.scripts]
dutch-ev = "dutch_ev_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
